# Netlify 배포 설정
#
# ⚠️ Next.js 사이트에서는 build.command / build.publish 를 직접 쓰지 않는다.
# Next.js 어댑터가 서버리스 함수·캐싱·라우팅을 포함한 출력 구조를 자동으로 만들기 때문에,
# publish 를 ".next" 로 고정하면 배포가 깨진다 (Netlify 공식 문서 확인).
#
# 여기서는 Background Function 설정만 둔다.
# netlify/functions 의 *-background.mts 는 15분까지 실행되므로,
# 일반 함수 제한(무료 10초)으로는 끝나지 않는 AI 스캔·분석을 이쪽에서 돌린다.
# (Background Functions 는 Free 플랜에서도 사용 가능 — 공식 문서 확인)

[functions]
  # 함수가 프로젝트의 lib/ 코드를 import 하므로 esbuild 로 번들한다.
  node_bundler = "esbuild"
